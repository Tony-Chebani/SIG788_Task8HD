# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - healthcare-bw

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # ✅ Install Node.js 24
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # (Optional) Install Node dependencies if you have package.json
      - name: Install Node dependencies
        run: |
          if [ -f package.json ]; then
            npm install
          fi

      # Existing Python setup (keep if you still need Python)
      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Create and Start virtual environment and Install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found, skipping dependency installation."
          fi

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_99E5DEF94D354CB98E17C13213B76F9C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_690DAACD7FF44569B827C91B038625C0 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C5FC9993EF1D4D7882E61C3E6B705BD8 }}         

      - name: Ensure Web App is running
        run: |
          APP_NAME="healthcare-bw"
          RESOURCE_GROUP="HealthcareBW-RG"

          echo "Checking Web App state..."

          STATE=$(az webapp show \
            --name $APP_NAME \
            --resource-group $RESOURCE_GROUP \
            --query "state" \
            --output tsv)

          echo "Current state: $STATE"

          if [ "$STATE" != "Running" ]; then
            echo "Web App is not running. Starting it..."
            az webapp start \
              --name $APP_NAME \
              --resource-group $RESOURCE_GROUP

            echo "Waiting for app to start..."
            sleep 20
          else
            echo "Web App is already running."
          fi
          - name: Deploy to Azure Web App
          uses: azure/webapps-deploy@v3
          id: deploy-to-webapp
          with:
            app-name: 'healthcare-bw'
            slot-name: 'Production'
